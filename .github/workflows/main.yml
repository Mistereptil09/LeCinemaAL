name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: adonis
          POSTGRES_PASSWORD: password
          POSTGRES_DB: le_cinema_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      NODE_ENV: test
      PORT: 3333
      HOST: localhost
      LOG_LEVEL: info
      APP_KEY: ${{ secrets.APP_KEY }}
      APP_URL: http://localhost:3333
      APP_VERSION: 1.0.0
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: adonis
      DB_PASSWORD: password
      DB_DATABASE: le_cinema_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Prepare environment
        run: cp .env.test .env

      - name: Run migrations
        run: node ace migration:run

      - name: Seed database
        run: node ace db:seed

      - name: Run tests
        run: node ace test
