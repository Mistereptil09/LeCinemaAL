name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npx tsc --noEmit

  test:
    needs: [lint, typecheck]
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: adonis
          POSTGRES_PASSWORD: password
          POSTGRES_DB: le_cinema_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      NODE_ENV: test
      DB_CONNECTION: pg
      PG_HOST: localhost
      PG_PORT: 5432
      PG_USER: adonis
      PG_PASSWORD: password
      PG_DB_NAME: le_cinema_test
      APP_KEY: ${{ secrets.APP_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Prepare environment
        run: cp .env.test .env

      - name: Run migrations
        run: node ace migration:run

      - name: Seed database
        run: node ace db:seed

      - name: Run tests
        run: node ace test
